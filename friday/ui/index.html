<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRIDAY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%234cc9f0' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234cc9f0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="wordmark"><span class="orb"></span>FRIDAY</div>
    <p class="muted">Paste your access token. It is kept in this browser only.</p>
    <input id="tokenInput" type="password" placeholder="fri_…" autocomplete="off" spellcheck="false" aria-label="Access token">
    <button class="btn primary" type="submit">Connect</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wordmark"><span id="orb" class="orb"></span>FRIDAY</div>
    <div class="top-meta">
      <span id="brain" class="pill" title="Active model backend">brain: …</span>
      <label class="pill select-pill" title="Autonomy level">autonomy
        <select id="autonomy" aria-label="Autonomy level">
          <option value="0">0 · Observe</option><option value="1">1 · Assist</option><option value="2">2 · Approved</option>
          <option value="3">3 · Autonomous</option><option value="4">4 · Executive</option>
        </select>
      </label>
      <span id="device" class="pill muted"></span>
    </div>
    <div class="top-actions">
      <button id="briefBtn" class="btn">Briefing</button>
      <button id="estop" class="btn danger" title="Disable all tool execution immediately">E-STOP</button>
      <button id="logout" class="btn ghost" title="Forget token on this browser">Lock</button>
    </div>
  </header>
  <div id="estopBanner" class="banner" hidden>
    EMERGENCY STOP ENGAGED — tool execution is disabled.
    <button id="resume" class="btn small">Release (owner)</button>
  </div>

  <main class="grid">
    <section class="panel chat" aria-label="Conversation">
      <div id="log" class="log" role="log" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <button id="mic" class="btn icon" type="button" title="Voice input (browser speech recognition)" aria-label="Voice input">🎙</button>
        <input id="msg" type="text" placeholder="Talk to FRIDAY…" autocomplete="off" aria-label="Message" maxlength="8000">
        <label class="speak" title="Speak replies aloud"><input id="speak" type="checkbox"> speak</label>
        <button class="btn primary" type="submit" id="send">Send</button>
      </form>
    </section>

    <aside class="side">
      <section class="panel" id="approvalsPanel">
        <h2>Approvals <span id="apCount" class="count"></span></h2>
        <div id="approvals" class="list"></div>
      </section>
      <section class="panel">
        <h2>Tasks <span id="taskCount" class="count"></span></h2>
        <form id="taskForm" class="inline"><input id="taskTitle" placeholder="Add task…" aria-label="New task"><button class="btn small">Add</button></form>
        <div id="tasks" class="list"></div>
      </section>
      <section class="panel">
        <h2>Notifications <span id="noteCount" class="count"></span> <button id="ackAll" class="btn small ghost">Clear</button></h2>
        <div id="notes" class="list"></div>
      </section>
    </aside>

    <section class="panel wide">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="activity" role="tab">Activity</button>
        <button class="tab" data-tab="memory" role="tab">Memory</button>
        <button class="tab" data-tab="business" role="tab">Business</button>
        <button class="tab" data-tab="devices" role="tab">Devices</button>
        <button class="tab" data-tab="security" role="tab">Security</button>
      </nav>
      <div id="tab-activity" class="tabpane"></div>
      <div id="tab-memory" class="tabpane" hidden></div>
      <div id="tab-business" class="tabpane" hidden></div>
      <div id="tab-devices" class="tabpane" hidden></div>
      <div id="tab-security" class="tabpane" hidden></div>
    </section>
  </main>
</div>
<script src="/ui/app.js"></script>
</body>
</html>

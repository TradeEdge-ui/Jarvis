[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-ai"
version = "0.1.0"
description = "FRIDAY — a local-first personal AI operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "psutil>=5.9",
  "openpyxl>=3.1",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "playwright>=1.44"]

[project.scripts]
friday = "friday.cli:main"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.setuptools.package-data]
friday = ["ui/*", "skills_builtin/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: needs Playwright + Chromium", "windows: only meaningful on Windows"]
